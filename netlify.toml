[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/kennenlerngespraech/"
  to = "/kennenlerngespraech/klarheitssitzung/"
  status = 301
  force = true

[[redirects]]
  from = "/dem-eigenen-folgen"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/dem-eigenen-folgen/"
  to = "/"
  status = 301
  force = true

# Vorübergehend abgeschaltet. Der alte Quelltext von Wirklich Deins., Arbeite mit mir und
# kennenlerngespraech/_wirklich_deins liegt in der Git-Geschichte (bis Commit d6ccf2a).
# Die alte Kennenlern-Adresse mit Unterstrich führt seit 30.10.2026 zur neuen Seite mit Bindestrich.
# 302, weil die Seiten später zurückkommen können.
[[redirects]]
  from = "/wirklich-deins/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/arbeite-mit-mir/*"
  to = "/kontakt/"
  status = 302
  force = true

[[redirects]]
  from = "/kennenlerngespraech/wirklich_deins/*"
  to = "/kennenlerngespraech/wirklich-deins/"
  status = 301
  force = true

[[redirects]]
  from = "http://petrasailer.com/*"
  to = "https://petrasailer.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.petrasailer.com/*"
  to = "https://petrasailer.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.petrasailer.com/*"
  to = "https://petrasailer.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:route/index.html"
  to = "/:route/"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
